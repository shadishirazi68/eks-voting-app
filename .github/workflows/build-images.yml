name: Build and push Docker images

on:
  push:
    branches:
      - eks-deployment

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    if: github.repository == 'shadishirazi68/eks-voting-app'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [vote, result, worker]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eks-${{ matrix.component }}:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    needs: build
    if: github.repository == 'shadishirazi68/eks-voting-app' && github.ref == 'refs/heads/eks-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-eks-shadi-voting-app
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: eks-shadi
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Log in to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "686699774218"
          role-session-name: GitHubActions-${{ github.run_id }}
          action-timeout-s: 120

      - name: Install kubectl
        uses: azure/setup-kubectl@v5.2.0
        with:
          version: v1.36.5

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --alias eks-shadi

      - name: Check deployment permissions
        run: |
          for component in vote result worker; do
            kubectl --context eks-shadi auth can-i patch "deployment/$component" \
              --namespace voting-app --quiet
          done

      - name: Update application images
        run: |
          for component in vote result worker; do
            kubectl --context eks-shadi set image "deployment/$component" \
              "$component=$DOCKERHUB_USERNAME/eks-$component:$IMAGE_TAG" \
              --namespace voting-app
          done

      - name: Wait for application rollout
        run: |
          for component in vote result worker; do
            kubectl --context eks-shadi rollout status "deployment/$component" \
              --namespace voting-app --timeout=180s
          done
          kubectl --context eks-shadi get deployments,pods --namespace voting-app
