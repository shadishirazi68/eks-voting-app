apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-app-ingress
  namespace: voting-app
  annotations:
    nginx.org/websocket-services: "result"
    nginx.org/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: "k8s-nginxing-nginxing-335d94f03d-ae5c0ea7f7c03815.elb.us-east-1.amazonaws.com"
      http:
        paths:
          - path: /vote
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 80
          - path: /result
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: 80
